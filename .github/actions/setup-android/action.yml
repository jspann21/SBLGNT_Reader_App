name: Set up Android build
description: Install the JDK and SDK used by this project and validate the Gradle wrapper.
runs:
  using: composite
  steps:
    - name: Validate vocabulary lists
      shell: bash
      run: python tools/vocabulary/compile_lists.py
    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: '25'
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
    - name: Install Android SDK packages
      shell: bash
      run: |
        (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
