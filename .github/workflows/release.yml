name: Release APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v1.0.0'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Validate version and tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected vMAJOR.MINOR.PATCH'; exit 1; }
          version=$(sed -n 's/^versionName=//p' version.properties | tr -d '\r')
          [[ "$RELEASE_TAG" == "v$version" ]] || { echo 'Tag must match version.properties'; exit 1; }
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
      - uses: ./.github/actions/setup-android
      - name: Run regression checks
        run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug --max-workers=2 --stacktrace --console=plain
      - name: Load release configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "Missing signing secret: $name"; exit 1; }
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
      - name: Compile signed release
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease :app:lintRelease --max-workers=2 --stacktrace --console=plain
      - name: Verify signature and prepare downloads
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/GNT-Reader-$RELEASE_TAG.apk"
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            [[ "$draft" == true ]] || { echo 'This version is already published; use a new tag.'; exit 1; }
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "GNT Reader $RELEASE_TAG" --draft
          fi
          gh release edit "$RELEASE_TAG" --draft=false
      - name: Upload reports and symbol mapping
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.p12" app/google-services.json
